<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Webnovel Tag Predictor</title>

    <link rel="stylesheet" href="/static/css/style.css" />
  </head>

  <body>
    <main>
      <h1>Webnovel Tag / Genre Predictor</h1>

      <label for="model">Model</label>
      <select id="model"></select>

      <label for="title">Title</label>
      <input
        id="title"
        type="text"
        placeholder="e.g. The Reincarnated Villainess"
      />

      <label for="description">Description</label>
      <textarea
        id="description"
        placeholder="The webnovel's description/summary goes here..."
      ></textarea>

      <label for="threshold">
        Threshold (<span id="thresholdVal">0.30</span>)
      </label>

      <input
        id="threshold"
        type="range"
        min="0.05"
        max="0.9"
        step="0.05"
        value="0.30"
        autocomplete="off"
      />

      <button id="predictBtn">Predict Tags</button>

      <div class="tag-row">
        <strong>Tag</strong>
        <strong>Probability</strong>
      </div>

      <div id="results"></div>
      <div id="error" class="error"></div>
    </main>

    <script src="/static/js/app.js"></script>
  </body>
</html>
